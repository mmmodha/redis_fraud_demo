# Fraud Command Center demo stack.
#
# Default (zero-config) wiring uses the bundled `redis-stack` service —
# activated via the `local-redis` profile when REDIS_URL is empty in .env.
# Presenter wiring (REDIS_URL points at Redis Cloud) skips the profile and
# every service connects to the managed database instead.

services:

  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: fcc-redis-stack
    profiles: ["local-redis"]
    ports:
      - "6379:6379"
    volumes:
      - redis_stack_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fcc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
    # wal_level=logical is required for RDI / Debezium CDC in Wave 2.
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bank} -d ${POSTGRES_DB:-bank}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Redis Data Integration: streams Postgres rows into the canonical
  # Redis keys (customer:*, account:*, card:*, device:*, merchant:*,
  # mcc:*, tx:*, stream:transactions, card:{id}:tx:recent) defined in
  # the demo spec. The container reads RDI-shaped YAML from ./rdi/config
  # so the same configuration can be lifted into the managed RDI Helm
  # chart for production.
  rdi:
    build:
      context: ./rdi
    container_name: fcc-rdi
    environment:
      REDIS_URL: ${REDIS_URL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      RDI_CONFIG_DIR: /etc/rdi/config
    volumes:
      - ./rdi/config:/etc/rdi/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f processor.py > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ../backend
    container_name: fcc-backend
    environment:
      REDIS_URL: ${REDIS_URL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      AGENT_MODE: ${AGENT_MODE:-}
      CTX_AGENT_KEY: ${CTX_AGENT_KEY:-}
      CTX_ADMIN_KEY: ${CTX_ADMIN_KEY:-}
    ports:
      - "8000:8000"
    # Mount the policy corpus so the seeder can call build_index() inside
    # this container — keeps sentence-transformers off the seeder image.
    volumes:
      - ../data/policies:/policies:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health | grep -q '\"redis\":\"ok\"' && curl -fsS http://localhost:8000/health | grep -q '\"postgres\":\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  feature-worker:
    build:
      context: ../backend
    container_name: fcc-feature-worker
    environment:
      REDIS_URL: ${REDIS_URL}
    command: ["python", "-m", "app.feature_worker"]
    depends_on:
      backend:
        condition: service_healthy
      rdi:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_REDIS_CLOUD_URL: ${NEXT_PUBLIC_REDIS_CLOUD_URL:-https://app.redislabs.com/}
        NEXT_PUBLIC_CONTEXT_RETRIEVER_URL: ${NEXT_PUBLIC_CONTEXT_RETRIEVER_URL:-}
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL:-}
    container_name: fcc-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot synthetic seeder. Lives in the `seed` profile so it never
  # starts under `compose up`; `scripts/seed.sh` invokes it with
  # `compose run --rm seeder ...`. Idempotent.
  seeder:
    build:
      context: ..
      dockerfile: infra/seeder/Dockerfile
    container_name: fcc-seeder
    profiles: ["seed"]
    environment:
      REDIS_URL: ${REDIS_URL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Playwright sanity runner. Lives in the `verify` profile so it stays
  # out of `compose up`; `scripts/demo-verify.sh` invokes it via
  # `compose run --rm verifier`. The official Playwright image ships the
  # browsers pre-installed so the host needs no Node / Chromium.
  verifier:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    container_name: fcc-verifier
    profiles: ["verify"]
    working_dir: /work
    volumes:
      - ../frontend:/work
      - verifier_node_modules:/work/node_modules
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:3000
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000
      CI: "1"
    depends_on:
      frontend:
        condition: service_healthy
    command:
      - bash
      - -lc
      - >-
        npm install --no-audit --no-fund --silent
        && npx playwright test tests/hero-scenarios.spec.ts
        --grep mike --reporter=line

volumes:
  postgres_data:
  redis_stack_data:
  verifier_node_modules:
