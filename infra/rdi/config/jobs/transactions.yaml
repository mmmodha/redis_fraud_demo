name: transactions
source:
  schema: public
  table: transactions
output:
  # 1. JSON point document for the transaction.
  - uses: redis.write
    with:
      connection: target
      data_type: json
      key: "tx:{transaction_id}"
      on_update: replace

  # 2. Push onto the global transaction stream the agent consumes.
  #    `maxlen` uses approximate trimming (XADD ... MAXLEN ~ N) so Redis Cloud
  #    can't drift into maxmemory on a long-running seed; ~5000 is well above
  #    a normal demo's working set yet capped well below the per-shard quota.
  - uses: redis.write
    with:
      connection: target
      data_type: stream
      key: "stream:transactions"
      maxlen: 5000

  # 3. Capped per-card recent-transactions list (rolling window of 100).
  - uses: redis.write
    with:
      connection: target
      data_type: list
      key: "card:{card_id}:tx:recent"
      direction: lpush
      cap: 100
